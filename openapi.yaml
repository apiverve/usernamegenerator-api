openapi: 3.0.4
info:
  title: Username Generator
  description: >-
    Username Generator creates handle suggestions from a person's name or email
    address. It returns an array of suggested usernames based on the input,
    while paid plans can request multiple options at once.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/usernamegenerator:
    get:
      summary: Username Generator
      description: Generate usernames based on the specified criteria
      operationId: usernamegenerator
      parameters:
        - name: email
          in: query
          schema:
            type: string
          required: true
          description: The email address to generate usernames from
          example: sean@mail.com
        - name: count
          in: query
          schema:
            type: integer
          required: false
          description: The number of usernames to generate
          example: 10
        - name: platform
          in: query
          schema:
            type: string
          required: false
          description: Only suggest handles this platform accepts (length and characters)
          example: twitter
        - name: maxLength
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Longest handle to suggest (3 to 50); combined with platform, the
            shorter limit wins
          example: 15
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 10
                  suggestions:
                    - smoothsean
                    - sean-blade
                    - infinitesean
                    - jadesean
                    - sean777
                    - hiddensean23
                    - seantv596
                    - sean_brightdragon
                    - shiningsean
                    - the_sean
                  email: sean@mail.com
                  platform: null
                  maxLength: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
